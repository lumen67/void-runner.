#crimson-vignette{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse 72% 65% at 50% 49%,transparent 48%,rgba(65,1,18,.27) 85%,rgba(106,0,26,.48) 100%)}
#crimson-approach-banner{position:fixed;top:16%;left:50%;transform:translate(-50%,-10px);
 z-index:7;pointer-events:none;opacity:0;text-align:center;max-width:91vw;
 color:#ffe2da;text-shadow:0 0 17px #fc355d,0 0 36px #fd1235;
 font:800 12px Arial;letter-spacing:.17em;border:1px solid #ff5d7980;
 background:linear-gradient(160deg,#320717e8,#14030dec);box-shadow:0 0 35px #ff104022;
 padding:13px 20px;border-radius:10px;transition:opacity .5s ease,transform .5s ease}
#crimson-approach-banner.visible{opacity:1;transform:translate(-50%,0)}
#crimson-arrival-veil{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse at 50% 45%,#fff7e5 0%,#ffb7ba 35%,#ff2854 78%,#5d021c 100%)}
#crimson-arrival-title{position:fixed;top:24%;left:50%;width:min(94vw,580px);
 z-index:9;pointer-events:none;text-align:center;transform:translateX(-50%);opacity:0;
 font-family:Arial,Helvetica,sans-serif;text-shadow:0 0 27px #f11843}
#crimson-arrival-title strong{display:block;font-size:clamp(41px,10vw,85px);font-weight:900;
 letter-spacing:.23em;color:#fff3e9;text-shadow:0 0 19px #ff3157,0 0 65px #ff1534,0 0 95px #7c0720}
#crimson-arrival-title span{display:block;margin:11px 0;font-size:clamp(9px,1.4vw,13px);
 font-weight:800;letter-spacing:.22em;color:#ffd7d4}
#cyan-clear-badge{position:fixed;top:15%;left:50%;z-index:9;pointer-events:none;
 transform:translate(-50%,12px);opacity:0;transition:opacity .65s ease,transform .65s ease;
 color:#edffff;font:900 clamp(14px,2.5vw,23px) Arial,sans-serif;
 text-align:center;letter-spacing:.13em;white-space:nowrap;
 text-shadow:0 0 12px #1bbde4,0 0 28px #008dc4,0 2px 6px #125276;
 background:linear-gradient(90deg,transparent,#1279958e 18%,#0c84a396 82%,transparent);
 padding:11px 19px;border-radius:18px}
#cyan-clear-badge small{display:block;margin-top:5px;font-size:clamp(8px,1.4vw,11px);
 letter-spacing:.21em;color:#d7fcff}
#cyan-clear-badge.visible{opacity:1;transform:translate(-50%,0)}
body.crimson-day .dimension{color:#ffdce1;text-shadow:0 1px 5px #8a071e,0 0 12px #ff3459}
body.crimson-day .distance{color:#fff1ee;text-shadow:0 0 15px #ff2b59}
body.crimson-day .tiny{color:#fff0ef;text-shadow:0 0 8px #78152b}

/* PRELANZAMIENTO v0.11.31 · selector de estrellas, sólo presentación CSS. */
.stars-screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(115deg,rgba(5,3,24,.96),rgba(15,6,43,.90) 54%,rgba(4,7,24,.88));padding:clamp(18px,4vh,42px) clamp(16px,5vw,64px);display:flex;align-items:center;flex-direction:column;gap:16px;pointer-events:auto;}
.stars-header{width:min(100%,980px);display:flex;align-items:center;justify-content:space-between;gap:12px;letter-spacing:.15em;font-size:11px;color:#c7b0f4;}
.stars-back{border:1px solid #8e70b17a;background:#130d29d9;color:#f2e7ff;padding:10px 17px;border-radius:12px;min-height:44px;}
.stars-title{text-align:center;margin:12px 0 0;font-size:clamp(27px,4vw,46px);font-weight:900;letter-spacing:.10em;text-shadow:0 0 32px #8d4bdf75;}
.stars-sub{text-align:center;font-size:12px;color:#b9accd;line-height:1.5;margin:0 0 12px;}
.stars-grid{width:min(100%,980px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-content:start;padding-bottom:25px;}
.star-card{position:relative;isolation:isolate;border:1px solid #614c88a3;border-radius:17px;min-height:170px;background:linear-gradient(150deg,#1a1630e8,#080e28f0);padding:20px 15px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;gap:8px;color:#dad0e4;overflow:hidden;}
.star-card strong{font-size:14px;letter-spacing:.13em}.star-card small{color:#a39bb7;font-size:10px;letter-spacing:.09em}.star-card .star-symbol{font-size:30px;align-self:center;margin:auto;text-shadow:0 0 18px #aa88cd;}
.star-card.locked{cursor:default;opacity:.75;filter:saturate(.65);}
.star-card.playable{grid-column:span 2;min-height:282px;border:1px solid #ab77f3;box-shadow:0 0 32px #7244df2c,inset 0 0 50px #743fbd1c;background:radial-gradient(ellipse at 65% 25%,#a53cff73,transparent 47%),radial-gradient(ellipse at 32% 18%,#5a9dfc44,transparent 44%),linear-gradient(130deg,#261543,#090d26);}
.star-card.playable .star-symbol{font-size:80px;line-height:1;filter:drop-shadow(0 0 25px #d55dff);color:#e8b3ff;}
.star-card.playable strong{font-size:clamp(17px,2.2vw,23px);color:white;}
.star-card.playable small{color:#cec2e9;font-size:11px;}
.stars-pill{display:inline-block;padding:5px 9px;border:1px solid #b398e7a3;border-radius:30px;font-size:10px;letter-spacing:.10em;color:#e9d9ff;background:#5a2d955e;}
.stars-launch{margin-top:7px;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:800;color:#140d2a;background:linear-gradient(110deg,#b567ff,#6adeff);letter-spacing:.09em;}
.star-card.playable:hover,.star-card.playable:focus-visible{border-color:#eee4ff;box-shadow:0 0 38px #8e68fa7b;outline:none;}
.stars-note{font-size:11px;color:#b5a9cd;text-align:center;max-width:640px;line-height:1.5;margin:0;}
@media(max-width:690px){.stars-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.star-card.playable{grid-column:span 2;min-height:235px}.star-card{min-height:130px;padding:14px 12px}.stars-screen{padding:16px 14px}.stars-title{margin:5px 0 0}.star-card.playable .star-symbol{font-size:62px}}
@media(max-height:580px) and (min-width:691px){.stars-screen{padding-top:12px;gap:7px}.stars-title{margin:0}.star-card.playable{min-height:190px}.star-card{min-height:125px}.star-card.playable .star-symbol{font-size:52px}}

/* VOID RUNNER - Ajustes adaptados a celulares verticales.
   Antes el panel largo se centraba verticalmente y ocultaba los controles superiores. */
.settings-overlay{
    justify-content:flex-start;
    align-items:center;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
}
.settings-overlay .panel{
    flex:0 0 auto;
    margin:0 auto 18px;
    width:min(490px,100%);
}
.settings-overlay .setting{
    flex-wrap:wrap;
}
.settings-overlay .setting select{
    max-width:100%;
    min-width:0;
}
@media(max-width:600px){
    .settings-overlay{
        padding:16px 12px max(32px,env(safe-area-inset-bottom));
    }
    .settings-overlay .panel{
        padding:20px 16px;
    }
    .settings-overlay .panel h2{
        font-size:34px;
        margin:14px 0;
    }
    .settings-overlay .setting{
        gap:8px;
        padding:11px 0;
    }
    .settings-overlay .audio-preview button{
        font-size:12px;
        padding:9px 10px;
    }
}

                    z:event.z,lane,kind:'crimson-fire-wall'});
            }
            this.nextCrimsonBladeId++;
        }
        this.crimsonBlades=this.crimsonBlades
            .filter(b=>b.z>this.distance-14)
            .sort((a,b)=>a.z-b.z||a.lane-b.lane);
        while(this.nextCrimsonFireId<CRIMSON_FIRE_EVENTS.length){
            const event=CRIMSON_FIRE_EVENTS[this.nextCrimsonFireId];
            if(event.z>=this.distance+270)break;
            this.crimsonFireballs.push({id:this.nextCrimsonFireId,
                z:event.z,lane:event.lane,kind:'crimson-fireball'});
            this.nextCrimsonFireId++;
        }
        this.crimsonFireballs=this.crimsonFireballs.filter(f=>f.z>this.distance-14);
        // Extend the predictable wing schedule first so generated hazards do not obstruct pickups.
        while (this.nextWingZ < this.distance + 210) {
            const unsafeOrb=this.iceGauntlets.some(g=>
                Math.abs(this.nextWingZ-g.z)<58 ||
                (this.nextWingZ+B.wingFlightMeters>g.z+10 &&
                 this.nextWingZ+B.wingFlightMeters<g.z+47));
            const unsafeCloud=this.cloudBridges.some(c=>
                this.nextWingZ>c.startZ-65 &&
                this.nextWingZ<c.startZ+CYAN_CLOUD_LENGTH+45);
            const unsafeClimax=this.nextWingZ>=CYAN_CLIMAX_START_Z-B.wingFlightMeters-28 &&
                this.nextWingZ<CYAN_CALM_START_Z+35;
            const unsafeCrimsonPortal=this.nextWingZ>CRIMSON_PORTAL_Z-245 &&
                this.nextWingZ<CRIMSON_PORTAL_Z+170;
            const unsafeCrimsonCourse=this.nextWingZ>=CRIMSON_BLADE_EVENTS[0].z-220 &&
                this.nextWingZ<=Infinity;
            if(unsafeOrb || unsafeCloud || unsafeClimax || unsafeCrimsonPortal || unsafeCrimsonCourse){
                this.nextWingZ=this.nextWingDistance(this.nextWingZ);
                continue;
            }
            const lane = Math.floor(this.wingRandom() * 3) - 1;
            this.wings.push({ id: this.nextWingId++, lane, z: this.nextWingZ });
            this.nextWingZ = this.nextWingDistance(this.nextWingZ);
        }
        this.iceFields=this.iceFields.filter(f=>
            !this.nearWing(f.z) && !this.inSafeLanding(f.z));
        // Course geometry stays on its original 36-unit cadence; optional safe stretches
        // around rare pickups and flight landings are the only skipped hazard slots.
        while (this.nextZ < this.distance + 210) {
            const id = this.nextId++;
            const lane = id === 1 ? 0 : Math.floor(this.random() * 3) - 1;
            const kind = id === 1 ? 'barrier' : id === 2 ? 'beam' : ['block', 'beam', 'barrier'][Math.floor(this.random() * 3)];
            const nearMeteor = this.meteorZones.some(m=>Math.abs(m.z-this.nextZ)<22);
            const safePickup = this.nearWing(this.nextZ) || this.inSafeLanding(this.nextZ);
            // Keep the road immediately after the first portal clear during its reveal.
            const portalRevealSafe = this.nextZ > 450 && this.nextZ < 535;
            // Calm ending: no hazards between 1700-1800; a few spaced far apart afterwards.
            const calmGap = this.nextZ>=2380 && this.nextZ<2440;
            const cyanRevealSafe = this.nextZ>CYAN_PORTAL_Z-120 && this.nextZ<CYAN_PORTAL_Z+155;
            const cyanCourse=this.nextZ>=CYAN_PORTAL_Z-115;
            if (!nearMeteor && !safePickup && !portalRevealSafe && !calmGap && !cyanRevealSafe && !cyanCourse) {
                const z=this.nextZ;
                // Climax: more two-lane decisions, but ALWAYS one fully open lane.
                const pairEvery = z<950?5 : z<1250?3 : z<1610?2 : z<2230?3 : 4;
                const isVioletChallenge = z>=650 && z<2380 && id%pairEvery===0;
                if (isVioletChallenge) {
                    const safeLane=[-1,0,1][Math.floor(id/pairEvery)%3];
                    const blockedLanes=[-1,0,1].filter(testLane=>testLane!==safeLane);
                    this.hazards.push({id,lane:blockedLanes[0],z,kind:'barrier'});
                    this.hazards.push({id:id+10000,lane:blockedLanes[1],z,kind:'beam'});
                } else {
                    this.hazards.push({id,lane,z,kind});
                }
            }
            // Accelerating parkour cadence: 36 -> 32 -> 28 world units per pattern.
            // After the crescendo, lots of open road to appreciate the incoming CYAN portal.
            const z=this.nextZ;
            this.nextZ += z<920?36 : z<1170?32 : z<1580?26 : z<2280?30 : z<2380?36 : 82;
        }
        // Remove hazards generated just before a newly scheduled pickup became visible.
        this.hazards = this.hazards.filter(h => h.z > this.distance - 12 && h.z<CYAN_PORTAL_Z-115 && !this.nearWing(h.z) && !this.inSafeLanding(h.z) && !this.fractures.some(f => Math.abs(f.z-h.z)<23) && !this.meteorZones.some(f => Math.abs(f.z-h.z)<22) && !(h.z>450 && h.z<535));
        while (this.nextCoinZ < this.distance + 210) {
            const lane = Math.floor(this.coinRandom() * 3) - 1;
            const blocked = this.hazards.some(h => h.lane === lane && Math.abs(h.z - this.nextCoinZ) < 3.8) || this.fractures.some(f => f.lane===lane && Math.abs(f.z-this.nextCoinZ)<6) || this.meteorZones.some(f => f.lane===lane && Math.abs(f.z-this.nextCoinZ)<7);
            const nearWings = this.nearWing(this.nextCoinZ);
            const nearGauntlet=this.iceGauntlets.some(g=>
                this.nextCoinZ>g.z-42 && this.nextCoinZ<g.z+CYAN_ABYSS_END_OFFSET+13);
            const nearSpikes=this.iceFields.some(f=>
                f.lane===lane && Math.abs(f.z-this.nextCoinZ)<7);
            const nearCloud=this.cloudBridges.some(c=>
                this.nextCoinZ>c.startZ-13 &&
                this.nextCoinZ<c.startZ+CYAN_CLOUD_LENGTH+8);
            const nearCrimson=this.crimsonBlades.some(b=>
                b.lane===lane && Math.abs(b.z-this.nextCoinZ)<8);
            const nearFire=this.crimsonFireballs.some(f=>
                f.lane===lane && Math.abs(f.z-this.nextCoinZ)<10);
            const missingRoad=CRIMSON_HOLE_EVENTS.some(h=>
                lane===h.lane && this.nextCoinZ>=h.startZ-4 && this.nextCoinZ<h.endZ+4) ||
              CRIMSON_COLLAPSE_EVENTS.some(h=>
                h.lanes.includes(lane) && this.nextCoinZ>=h.startZ-7 && this.nextCoinZ<h.endZ+7);
            if (!blocked && !nearWings && !nearGauntlet && !nearSpikes && !nearCloud && !nearCrimson && !nearFire && !missingRoad)
                this.coins.push({ id: this.nextCoinId++, lane, z: this.nextCoinZ });
            this.nextCoinZ += 11;
        }
        this.coins = this.coins.filter(c => c.z > this.distance - 3);
        this.wings = this.wings.filter(w => w.z > this.distance - 3);
        this.landingSafeZones = this.landingSafeZones.filter(z => z + B.wingSafeRadius > this.distance);
    }
    activateWings(w) {
        this.wingsCollected++;
        this.wings = this.wings.filter(entry => entry.id !== w.id);
        this.flying = true;
        this.flightTravel = 0;
        this.flightStartY = this.y;
        this.flightLandingZ = this.distance + B.wingFlightMeters;
        this.landingSafeZones.push(this.flightLandingZ);
        // Existing hazards near landing are removed as well as future generated ones.
        this.hazards = this.hazards.filter(h => Math.abs(h.z - this.flightLandingZ) > B.wingSafeRadius);
        this.iceWalls=this.iceWalls.filter(w=>Math.abs(w.z-this.flightLandingZ)>B.wingSafeRadius);
        this.iceFields=this.iceFields.filter(f=>Math.abs(f.z-this.flightLandingZ)>B.wingSafeRadius);
        this.jump = 0;
        this.jumpStage = 0;
        this.slide = 0;
    }
    beginAbyssFall(gate){
        this.falling=true;
        this.fallTime=0;
        this.jump=0;
        this.jumpStage=0;
        this.jumpBaseY=0;
        this.hit={kind:'cyan-abyss',lane:this.lane,z:gate.z,id:gate.id};
    }
    beginCloudFall(bridge){
        this.pendingCloudFall=null;
        this.falling=true;
        this.fallTime=0;
        this.jump=0;
        this.jumpStage=0;
        this.jumpBaseY=0;
        this.hit={kind:'cloud-fall',lane:this.lane,z:bridge.startZ,id:bridge.id};
    }
    beginCrimsonHoleFall(hole){
        this.falling=true;
        this.fallTime=0;
        this.jump=0;this.jumpStage=0;this.jumpBaseY=0;
        this.hit={kind:'crimson-hole',lane:this.lane,z:hole.startZ};
    }
    step() {
        if (this.session !== 'PLAYING')
            return;
        this.previousDistance = this.distance;
        this.previousX = this.x;
        this.previousY = this.y;
        this.tick++;
        if(this.falling){
            // Let the character visibly drop into the open sky for a moment
            // before the results screen, rather than dying while airborne.
            this.fallTime+=B.step;
            this.distance+=this.speed*B.step*.27;
            this.y=-(3.8*this.fallTime+13*this.fallTime*this.fallTime);
            if(this.fallTime>=.72)this.session='HIT_FREEZE';
            return;
        }
        if (this.flying) {
            const remaining = B.wingFlightMeters - this.flightTravel;
            const delta = Math.min(remaining, (B.wingFlightMeters / B.wingFlightSeconds) * B.step);
            this.distance += delta;
            this.flightTravel += delta;
            const p = Math.min(1, this.flightTravel / B.wingFlightMeters);
            const rise = Math.min(1, p / .13);
            const fall = Math.max(0, Math.min(1, (1 - p) / .19));
            const smooth = (t) => t * t * (3 - 2 * t);
            this.y = (this.flightStartY * (1 - smooth(rise)) + 3.05 * smooth(rise)) * smooth(fall);
            if (remaining - delta <= 0.00001) {
                this.flying = false;
                this.flightTravel = 0;
                this.y = 0;
                this.previousY = 0;
            }
            this.coins = this.coins.filter(c => c.z > this.distance - 3);
            this.populate();
            return;
        }
        this.distance += this.speed * B.step;
        this.laneElapsed = Math.min(B.laneTime, this.laneElapsed + B.step);
        const t = this.laneElapsed / B.laneTime;
        this.x = this.fromX + (this.lane * B.laneWidth - this.fromX) * (t * t * (3 - 2 * t));
        if (this.jumpStage > 0) {
            this.jump += B.step;
            const duration = this.jumpStage === 2 ? B.doubleJumpTime : B.jumpTime;
            if (this.jump >= duration) {
                this.jump = 0;
                this.jumpStage = 0;
                this.jumpBaseY = 0;
                this.y = 0;
            }
            else if (this.jumpStage === 2) {
                const p = this.jump / duration;
                this.y = this.jumpBaseY * (1 - p) + 4 * B.doubleJumpHeight * p * (1 - p);
            }
            else {
                const p = this.jump / B.jumpTime;
                this.y = 4 * B.jumpHeight * p * (1 - p);
            }
        }
        this.slide = Math.max(0, this.slide - B.step);
        // A timed crosswind nudges only players occupying the warned lane. No damage.
        // The adjacent destination is guaranteed in-bounds, and nearby hazards were
        // excluded by populate(), so the push cannot cause an unavoidable hit.
        if (this.distance > CYAN_PORTAL_Z+160) for(const gust of this.winds){
            if(gust.resolved || gust.z>this.distance)continue;
            gust.resolved=true;
            const inLane=this.lane===gust.lane && Math.abs(this.x-gust.lane*B.laneWidth)<1.03;
            if(!inLane)continue;
            const dest=Math.max(-1,Math.min(1,this.lane+gust.dir));
            if(dest===this.lane)continue;
            const from=this.lane;
            this.fromX=this.x;
            this.lane=dest;
            this.laneElapsed=0;
            this.windPushTick=this.tick;
            this.lastWindPush={id:gust.id,from,to:dest,z:gust.z,dir:gust.dir};
        }
        // Rare elevated collectible: only the second jump can reach the pickup height.
        for (const wing of this.wings) {
            if (wing.z < this.previousDistance - .8 || wing.z > this.distance + .8)
                continue;
            if (this.jumpStage === 2 && this.y >= B.wingPickupMinY && Math.abs(this.x - wing.lane * B.laneWidth) < 1) {
                this.activateWings(wing);
                break;
            }
        }
        // v0.7.4: the old holes are removed; meteorites now become grounded hazards.
        if (!this.flying && this.session==='PLAYING' && !this.shieldActive) {
            for (const h of this.hazards) {
                if (this.collides(h)) {
                    this.hit = h;
                    this.session = 'HIT_FREEZE';
                    break;
                }
            }
            if (this.session==='PLAYING') {
                for (const wall of this.iceWalls){
                    if(this.collides(wall)){
                        this.hit={...wall};
                        this.session='HIT_FREEZE';
                        break;
                    }
                }
            }
            if(this.session==='PLAYING')for(const blade of this.crimsonBlades){
                // These standing bonfires are ~4m tall; swapping lanes is the
                // intended solution. Swept checks prevent high-speed tunnelling.
                if(blade.z+1.12<this.previousDistance || blade.z-1.12>this.distance)continue;
                const delta=this.distance-this.previousDistance;
                const a=delta>0?Math.max(0,(blade.z-1.12-this.previousDistance)/delta):0;
                const b=delta>0?Math.min(1,(blade.z+1.12-this.previousDistance)/delta):1;
                for(const k of [a,(a+b)/2,b]){
                    const x=this.previousX+(this.x-this.previousX)*k;
                    if(Math.abs(x-blade.lane*B.laneWidth)<1.06){
                        this.hit={...blade,kind:'crimson-fire-wall'};
                        this.session='HIT_FREEZE';
                        break;
                    }
                }
                if(this.session==='HIT_FREEZE')break;
            }
            // CRIMSON holes are actual missing one-lane slabs. Exactly like
            // CYAN's real voids, an active jump is never killed in midair.
            if(this.session==='PLAYING')for(const hole of CRIMSON_HOLE_EVENTS){
                if(this.distance<hole.startZ || this.distance>=hole.endZ)continue;
                if(this.jumpStage===0 &&
                   Math.abs(this.x-hole.lane*B.laneWidth)<1.03){
                    this.beginCrimsonHoleFall(hole);break;
                }
            }
            // A falling slab only becomes a physical gap once it has actually
            // detached. The lead distance is large enough to finish falling
            // before the runner arrives. Never kill a runner still airborne.
            if(this.session==='PLAYING')for(const collapse of CRIMSON_COLLAPSE_EVENTS){
                if(this.distance<collapse.startZ || this.distance>=collapse.endZ)continue;
                if(this.jumpStage!==0)continue;
                if(collapse.lanes.some(lane=>Math.abs(this.x-lane*B.laneWidth)<1.03)){
                    this.beginCrimsonHoleFall({startZ:collapse.startZ});break;
                }
            }
            if(this.session==='PLAYING')for(const fire of this.crimsonFireballs){
                // Fast fireballs have a generous visual cue, a compact hitbox
                // and a vertical escape: a well-timed double jump also works.
                if(fire.z+1.15<this.previousDistance || fire.z-1.15>this.distance)continue;
                const delta=this.distance-this.previousDistance;
                const a=delta>0?Math.max(0,(fire.z-1.15-this.previousDistance)/delta):0;
                const b=delta>0?Math.min(1,(fire.z+1.15-this.previousDistance)/delta):1;
                for(const k of [a,(a+b)/2,b]){
                    const x=this.previousX+(this.x-this.previousX)*k;
                    const y=this.previousY+(this.y-this.previousY)*k;
                    if(Math.abs(x-fire.lane*B.laneWidth)<.93 && y<1.75){
                        this.hit={...fire};this.session='HIT_FREEZE';break;
                    }
                }
                if(this.session==='HIT_FREEZE')break;
            }
            if(this.session==='PLAYING') for(const field of this.iceFields){
                if(!field.spikes)continue;
                // Spike rows exceed double-jump clearance; this zone is a lane blocker.
                // Crossing its frozen lane is unsafe; neighbouring lanes stay open.
                if(field.z+.92<this.previousDistance || field.z-.92>this.distance)continue;
                const delta=this.distance-this.previousDistance;
                const start=delta>0?Math.max(0,(field.z-.92-this.previousDistance)/delta):0;
                const end=delta>0?Math.min(1,(field.z+.92-this.previousDistance)/delta):1;
                for(const t of [start,(start+end)/2,end]){
                    const x=this.previousX+(this.x-this.previousX)*t;
                    if(Math.abs(x-field.lane*B.laneWidth)<1.08){
                        this.hit={id:'frost-'+field.id,lane:field.lane,z:field.z,
                            kind:'frost-spikes',iceType:'spikes',fixed:!!field.fixed};
                        this.session='HIT_FREEZE';
                        break;
                    }
                }
                if(this.session==='HIT_FREEZE')break;
            }
            // The two monumental ice blocks cannot be jumped or slid under.
            // The 24m gap has no floor. Never interrupt an active jump midair:
            // only begin falling when the jumping motion actually finishes
            // before the opposite ledge. At normal CYAN speeds two jumps are needed.
            if(this.session==='PLAYING') for(const gate of this.iceGauntlets){
                if(this.distance>=gate.z-3.3 && this.previousDistance<=gate.z+3.3){
                    for(const lane of [-1,0,1]){
                        if(lane===gate.safeLane)continue;
                        const delta=this.distance-this.previousDistance;
                        const a=delta>0?Math.max(0,(gate.z-3.3-this.previousDistance)/delta):0;
                        const b=delta>0?Math.min(1,(gate.z+3.3-this.previousDistance)/delta):1;
                        for(const t of [a,(a+b)/2,b]){
                            const x=this.previousX+(this.x-this.previousX)*t;
                            if(Math.abs(x-lane*B.laneWidth)<1.08){
                                this.hit={kind:'ice-monolith',lane,z:gate.z,id:gate.id};
                                this.session='HIT_FREEZE';
                                break;
                            }
                        }
                        if(this.session==='HIT_FREEZE')break;
                    }
                }
                if(this.session==='HIT_FREEZE')break;
                if(this.distance>=gate.z+CYAN_ABYSS_START_OFFSET &&
                    this.distance<gate.z+CYAN_ABYSS_END_OFFSET &&
                    this.jumpStage===0){
                    this.beginAbyssFall(gate);
                    break;
                }
            }
            // The impostor cloud lanes vanish underfoot. Keep the landing
            // animation fair, including for an airborne runner who tries to
            // skip an entire fake cloud with a precisely timed double jump.
            if(this.session==='PLAYING' && this.pendingCloudFall && this.jumpStage===0){
                this.beginCloudFall(this.pendingCloudFall);
            }
            if(this.session==='PLAYING') for(const bridge of this.cloudBridges){
                const supported=Math.abs(this.x-bridge.safeLane*B.laneWidth)<1.0;
                const exitZ=bridge.startZ+CYAN_CLOUD_LENGTH-2;
                // Snapshot the choice at the far edge. A wrong lane that
                // remains airborne owes a fall on its next landing.
                if(this.previousDistance<exitZ && this.distance>=exitZ && !supported){
                    if(this.jumpStage>0)this.pendingCloudFall={...bridge};
                    else this.beginCloudFall(bridge);
                    break;
                }
                if(this.distance<=bridge.startZ+2 || this.distance>=exitZ)continue;
                if(!supported && this.jumpStage===0){
                    this.beginCloudFall(bridge);
                    break;
                }
            }
            if(this.falling)return;
            if (this.session==='PLAYING') {
                for (const m of this.meteorZones) {
                    if (m.z + .95 < this.previousDistance || m.z - .95 > this.distance) continue;
                    const dz=this.distance-this.previousDistance;
                    const a=dz>0 ? Math.max(0,(m.z-.95-this.previousDistance)/dz) : 0;
                    const b=dz>0 ? Math.min(1,(m.z+.95-this.previousDistance)/dz) : 1;
                    for(const k of [a,(a+b)*.5,b]) {
                        const x=this.previousX+(this.x-this.previousX)*k;
                        const y=this.previousY+(this.y-this.previousY)*k;
                        if(Math.abs(x-m.lane*B.laneWidth)<.98 && y<1.12){
                            this.hit={id:'meteor-'+m.id,lane:m.lane,z:m.z,kind:'meteor'};
                            this.session='HIT_FREEZE';
                            break;
                        }
                    }
                    if(this.session==='HIT_FREEZE')break;
                }
            }
        }
        if (!this.flying) {
            for (let i = this.coins.length - 1; i >= 0; i--) {
                const c = this.coins[i];
                if (c.z < this.previousDistance - .7 || c.z > this.distance + .7)
                    continue;
                if (Math.abs(this.x - c.lane * B.laneWidth) < .90) {
                    this.coinsCollected++;
                    this.lastCoinTick = this.tick;
                    this.coins.splice(i, 1);
                }
            }
        }
        this.populate();
        this.stepStarOne();
    }
    collides(h) {
        if (this.flying)
            return false;
        const halfDepth = .48 + B.playerDepth;
        if (h.z + halfDepth < this.previousDistance || h.z - halfDepth > this.distance)
            return false;
        const dz = this.distance - this.previousDistance;
        const a = dz > 0 ? Math.max(0, (h.z - halfDepth - this.previousDistance) / dz) : 0;
        const b = dz > 0 ? Math.min(1, (h.z + halfDepth - this.previousDistance) / dz) : 1;
        for (const t of [a, (a + b) / 2, b]) {
            const x = this.previousX + (this.x - this.previousX) * t;
            const y = this.previousY + (this.y - this.previousY) * t;
            if (Math.abs(x - h.lane * B.laneWidth) > .93 + B.playerHalfWidth)
                continue;
            const height = this.slide > 0 ? .6 : B.playerHeight;
            const low = h.kind === 'beam' ? .85 : 0;
            const high = h.kind === 'barrier' ? .52 : 2.1;
            if (y < high && y + height > low)
                return true;
        }
        return false;

    /** Lightweight faux-chrome reflection bands, shared by the suit pieces.

    makeChromeSuitMaterial() {
        const canvas = document.createElement('canvas');

        const ctx = canvas.getContext('2d');
        if (ctx) {
            // High contrast sky-and-neon reflections create a polished, mirrorlike silver.

            const bands = [
                [0, '#06050c'], [.09, '#150f27'], [.18, '#5b3a9c'],
                [.235, '#21173a'], [.31, '#0a0812'], [.40, '#2a1d4b'],
                [.49, '#b9a0ff'], [.535, '#3a2a66'], [.61, '#0a0811'],
                [.725, '#271b45'], [.81, '#9d76ff'], [.875, '#130d24'],
                [1, '#06050c']
            ];
            for (const [stop, color] of bands) steel.addColorStop(stop, color);
            ctx.fillStyle = steel;
            ctx.fillRect(0, 0, 256, 256);
            // A few broad reflected light bars, not stars or additional geometry.
            const flash = ctx.createLinearGradient(0, 0, 256, 0);
            flash.addColorStop(0, 'rgba(255,255,255,0)');
            flash.addColorStop(.31, 'rgba(255,255,255,0)');
            flash.addColorStop(.40, 'rgba(190,150,255,.30)');
            flash.addColorStop(.46, 'rgba(255,255,255,.02)');
            flash.addColorStop(.68, 'rgba(255,255,255,0)');
            flash.addColorStop(.75, 'rgba(210,180,255,.20)');
            flash.addColorStop(.81, 'rgba(255,255,255,0)');
            flash.addColorStop(1, 'rgba(255,255,255,0)');

    /** Reusable faceted rocky geometry (icosahedron), with deterministic mineral-purple/cyan facets.

    orbSphere(radius, segments = 14, rings = 10) {
        const pos = [];
        const normal = [];
        for (let iy = 0; iy < rings; iy++) {
            const t0 = Math.PI * iy / rings, t1 = Math.PI * (iy + 1) / rings;
            for (let ix = 0; ix < segments; ix++) {
                const p0 = 2 * Math.PI * ix / segments, p1 = 2 * Math.PI * (ix + 1) / segments;
                const v = (t, p) => [Math.sin(t) * Math.cos(p), Math.cos(t), Math.sin(t) * Math.sin(p)];
                const a = v(t0, p0), b = v(t1, p0), c = v(t0, p1), d = v(t1, p1);
                for (const face of [[a, c, b], [b, c, d]]) {
                    for (const vert of face) {
                        pos.push(vert[0] * radius, vert[1] * radius, vert[2] * radius);
                        normal.push(...vert);
                    }
                }
            }
        }
        const geo = new T.BufferGeometry();
        geo.setAttribute('position', new T.BufferAttribute(new Float32Array(pos), 3));
        geo.setAttribute('normal', new T.BufferAttribute(new Float32Array(normal), 3));
        return geo;
    }

    updateSparks(sim, playing, x, y) {

            this.sparkPosition[k + 1] += this.sparkVy[i] * dt;

const ADSGRAM_BLOCKS = Object.freeze({ revive: '58796', start: '58797', end: '58798' });
const adsgramControllers = Object.create(null);
let adsgramBusy = false;
function adsgramMessage(message){
    const panel = ui.querySelector('.overlay .panel');
    if(!panel) return;
    let note = panel.querySelector('#adsgram-status');
    if(!note){ note=document.createElement('p'); note.id='adsgram-status';note.className='notice';note.setAttribute('role','status');panel.append(note); }
    note.textContent=message;
}
function adsgramLockButtons(locked){
    ui.querySelectorAll('button[data-action="revive"],button[data-action="startDouble"],button[data-action="boostEnd"]').forEach(btn=>{
        btn.disabled=locked;
        btn.style.opacity=locked?'0.55':'';
    });
}
async function showRewardedAd(placement, expectedScreen, onReward){
    if(adsgramBusy || screen!==expectedScreen) return;
    adsgramBusy=true;
    adsgramLockButtons(true);
    adsgramMessage('Preparando anuncio recompensado…');
    try {
        const ads = window.Adsgram;
        if(!ads || typeof ads.init!=='function') throw new Error('El servicio de anuncios no está disponible.');
        let controller = adsgramControllers[placement];
        if(!controller) controller = adsgramControllers[placement]=ads.init({blockId: ADSGRAM_BLOCKS[placement]});
        if(!controller || typeof controller.show!=='function') throw new Error('No se pudo iniciar el anuncio.');
        const result = await controller.show();
        // A rewarded-ad completion must be positively confirmed, never inferred from just closing the ad.
        if(!result || result.done!==true || result.error===true) throw new Error('El anuncio no se completó.');
        if(screen!==expectedScreen) return;
        onReward();
    } catch(error){
        if(screen===expectedScreen){
            adsgramMessage('No se completó el anuncio o no hay anuncios disponibles. No se aplicó ninguna recompensa. Puedes volver a intentarlo.');
        }
        console.warn('VOID RUNNER AdsGram: recompensa no concedida', error);
    } finally {
        adsgramBusy=false;
        adsgramLockButtons(false);
    }
}

            }
            const wingStatus = document.getElementById('wing-status');
            wingStatus.textContent = sim.flying ? `◈ ORBE DEL VACÍO · ${Math.ceil(200 - sim.flightTravel)} m` : '';
            wingStatus.style.display = sim.flying ? 'block' : 'none';
            const windStatus=document.getElementById('wind-status');
            const nextWind=sim.winds.find(w=>!w.resolved && w.z>=sim.distance-2);
            const windAhead=nextWind?nextWind.z-sim.distance:999;
            const recentPush=sim.tick-sim.windPushTick<65;
            windStatus.style.display='none';
            windStatus.textContent=recentPush ? '🌬 ¡RÁFAGA! CAMBIO DE CARRIL' :
              nextWind && windAhead<80 ? `🌬 VIENTO EN CARRIL ${nextWind.lane+2} · ${nextWind.dir>0?'→':'←'} · ESQUIVA` : '';
            const hint = document.getElementById('hint');
            const next = sim.hazards.find(h => h.z > sim.distance - 1);
            const availableWing = sim.wings.find(w => w.z > sim.distance && w.z - sim.distance < 42);
            // All basic tutorial hints end permanently upon entering VIOLET.
            // Game controls remain available; only the guidance overlay disappears.
            if (portalTriggered || sim.distance >= 450) {
                hint.textContent = '';
                hint.style.display = 'none';
            } else {
                hint.textContent = sim.flying ? '✦ IMPULSO DIMENSIONAL · VUELAS 200 M ✦' :
                    availableWing ? '↑ ↑ DOBLE SALTO PARA ALCANZAR EL ORBE' :
                    next && next.z - sim.distance < 30 ? (next.kind === 'barrier' ? '↑ SALTA O CAMBIA DE CARRIL' : next.kind === 'beam' ? '↓ DESLIZA O CAMBIA DE CARRIL' : '← ESQUIVA EL BLOQUE →') :
                    sim.distance<60 ? '← → / A D · CAMBIA DE CARRIL · DESLIZA EN MÓVIL' :
                    sim.distance<140 ? '↑ / ESPACIO · SALTA LAS BARRERAS BAJAS' :
                    sim.distance<220 ? '↓ / S · DESLÍZATE BAJO LAS VIGAS' :
                    sim.distance<325 ? '↑ ↑ · DOBLE SALTO · APRENDE A CONTROLAR EL AIRE' :
                    sim.distance<420 ? 'COMBINA SALTO, DESLIZAMIENTO Y CAMBIO DE CARRIL' :
                    '✧ TUTORIAL SUPERADO · PORTAL VIOLET EN CAMINO';
                hint.style.display = hint.textContent ? 'block' : 'none';
            }
        }
        if(prev && sim.session==='PLAYING' && mobileDevice){
            const ms=Math.min(80,Math.max(0,now-prev));
            frameBlockMs+=ms;frameBlockCount++;
            if(frameBlockCount>=150){
                const avg=frameBlockMs/frameBlockCount;
                frameBlockMs=0;frameBlockCount=0;
                if(dynamicCooldown>0)dynamicCooldown--;
                if(!dynamicCooldown && avg>27 && (view.dynamicResolutionScale??1)>.68){
                    view.dynamicResolutionScale=Math.max(.68,(view.dynamicResolutionScale??1)-.12);
                    view.resize();dynamicCooldown=2;
                } else if(!dynamicCooldown && avg<19 && (view.dynamicResolutionScale??1)<1){
                    // Recover gently to avoid resolution oscillation on thermally limited phones.
                    view.dynamicResolutionScale=Math.min(1,(view.dynamicResolutionScale??1)+.04);
                    view.resize();dynamicCooldown=3;
                }
            }
        }
        if (prev && sim.session === 'PLAYING') {
            frames.push(now - prev);
            if (frames.length > 600)
                frames.shift();
        }
        prev = now;
        rendered++;
        requestAnimationFrame(frame);
    }
    // Read-only diagnostics; never controls gameplay or awards.
    Object.defineProperty(window, 'voidDiagnostics', { get: () => ({ phase: 5, session: sim.session, screen, revivesUsed:sim.revivesUsed, shieldSeconds:sim.shieldSeconds, tick: sim.tick, distance: sim.distance, x: sim.x, y: sim.y, motion: sim.motion, seed: initialSeed, hazards: sim.hazards.length, violetPairs: sim.hazards.filter(h => h.id>=10000).length, meteorCount:view.meteorVisuals.length, cyanGateVisible:view.cyanPortal.visible, cyanTriggered, windGusts:sim.winds.length, iceWalls:sim.iceWalls.length, iceWallVisuals:view.iceWallVisuals.length, iceFields:sim.iceFields.length, frostVisuals:view.frostVisuals.length, nextFrost:sim.iceFields.length?sim.iceFields[0].z:null, nextIce:sim.iceWalls.length?sim.iceWalls[0].z:null, windPushes:sim.lastWindPush?sim.lastWindPush.id+1:0, lastWindPush:sim.lastWindPush, starOne:sim.star?{phase:sim.star.phase,health:sim.star.health,hits:sim.star.hits,combatPhase:sim.star.combatPhase,counter:sim.star.counter,projectile:sim.star.projectile,portalZ:sim.star.portalZ,attacks:sim.star.attacks.length}:null, dimension:sim.distance>=CRIMSON_PORTAL_Z?'CRIMSON':sim.distance>=CYAN_PORTAL_Z?'CYAN':sim.distance>=450?'VIOLET':'PRÓLOGO', wings: sim.wings.length, wingsCollected: sim.wingsCollected, flying: sim.flying, flightTravel: sim.flightTravel, wingPreview, rendered, sound:{muted:sound.muted,effects:sound.effects,music:sound.music,available:sound.available,volume:sound.volume}, ...view.stats(), mobileQuality:mobileDevice?{base:quality,renderScale:view.dynamicResolutionScale??1}:null, fpsMedian: frames.length ? 1000 / [...frames].sort((a, b) => a - b)[Math.floor(frames.length / 2)] : null }) });
    requestAnimationFrame(frame);
}
catch (error) {
    console.error('VOID RUNNER: error al iniciar:', error);
    const detail = String(error?.message || error || 'Error desconocido');
    const webglError = /WebGLRenderer|WebGL 2|Unable to create WebGL|webgl context|WebGL context/i.test(detail);
    ui.innerHTML = '<section class="screen overlay"><div class="panel"><h2></h2><p></p><p class="notice" id="startup-detail"></p><button class="button" id="retry">Reintentar</button></div></section>';
    ui.querySelector('h2').textContent = webglError ? 'WebGL no disponible.' : 'Error al iniciar el juego.';
    ui.querySelector('.panel > p').textContent = webglError ? 'El navegador no logró crear un contexto 3D.' : 'Ocurrió un problema al cargar esta versión. No necesariamente es tu navegador.';
    document.getElementById('startup-detail').textContent = detail;
    document.getElementById('retry').onclick = () => location.reload();
}

})();</script></body></html>
